# 研究框架配置（docs/13-研究框架.md §2）。
# 字段与 pydantic 模型 trade.research.config.ResearchConfig 一一对应，未知字段报错。

paths:
  klines_1h: ./data/klines_1h
  klines_1d: ./data/klines_1d
  klines_1h_flow: ./data/klines_1h_flow # 主动买入成交（docs/13 §1）
  premium_1h: ./data/premium_1h # 溢价指数 1h
  mark_1h: ./data/mark_1h # 标记价格 1h，止损触发基准
  funding: ./data/funding
  universe_hist: ./data/universe_hist
  research_cache: ./artifacts/research_cache
  experiments_log: ./artifacts/reports/EXPERIMENTS.log
  artifacts: ./artifacts
  data_root: ./data

rolling:
  train_months: 12 # 研究起点起最初 12 个月只做训练与预热
  folds: 5 # 训练期之后切成 5 个等长验证折

bootstrap:
  iters: 10000
  seed: 42

execution:
  half_spread_top_n: 20 # 当月 30 天成交额前 20 名
  half_spread_top_bp: 1.0 # 前 20 名最小半价差 1bp
  half_spread_other_bp: 3.0 # 其余最小半价差 3bp
  slip_min_bp: 1.0 # 最小单边滑点 1bp
  impact_y: 1.0 # 平方根冲击模型系数（backtest.yaml costs.Y）
  impact_vol_hours: 24 # 冲击模型的波动与成交额窗口（小时）
  stop_slip_mult: 2.0 # 止损成交按 2 倍滑点
  cooldown_hours: 24 # 止损后该币 24 小时内不同方向开仓
  delist_penalty: 0.01 # 下架 / 断档强制平仓额外 1% 惩罚
  stop_max: 0.15 # 止损距离硬上限

portfolio:
  total_notional_cap: 3.0 # 多 + 空总名义 ≤ 权益 × 3（使用者确定，红线 5）
  net_exposure_cap: 1.5 # 净敞口绝对值 ≤ 权益 × 1.5（使用者确定，红线 5）
  margin_cap: 0.95 # 总保证金 ≤ 权益 × 0.95
  liq_cap_hours: 24 # 流动性上限使用的成交额窗口（小时）
  max_positions: 10 # 与 sizing_research.yaml 一致

risk:
  halt_mode: reset # 研究 / 最终检验的 R6/R8 停机：reset 停 7 个自然日后按当时权益继续
  halt_reset_days: 7 # 影子盘与实盘固定 strict（docs/07 §6），不读取本节

equity:
  signal: 10000 # 信号口径：达标判定、选参、Deflated Sharpe 与试验登记
  exec: 500 # 可执行口径：可执行性检查、档位选择、影子盘与实盘

quality:
  missing_ratio_max: 0.01 # 选币第 7 步：1h K 线缺失比例 ≤ 1%

scenarios: [base, cost2x, nohalt, delay1, shuffle, long_only, short_only]
