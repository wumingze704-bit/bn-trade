# 实盘运行配置示例。规格：docs/07-实盘与风控.md §10
# 说明：本文件为 P5 实现前的配置规格；字段与 pydantic 模型在 P5 落地。
mode: shadow # paper | shadow | live
model_dir: ./artifacts/models/20261101_tcn_a1b2c3

# 实盘监控/信号候选池：动态获取币安 USDⓈ-M USDT 永续 24 小时涨幅榜前 N。
# 候选池不是强制交易名单；是否开仓仍由特征、预过滤、模型阈值、组合排序与风控决定（07 §3.5）。
candidate_pool:
  enabled: true # 动态候选池开关；false 时回退到 coins.yaml 固定交易名单（仅用于 P5 联调）
  size: 20 # 涨幅榜前 N（默认 20，使用者可调）
  refresh_minutes: 15 # 刷新周期（分钟）；保守默认，待 P5 按 /fapi/v1/ticker/24hr 权重实测后调整

margin_type: ISOLATED
position_mode: ONE_WAY
sizing: ./configs/sizing.yaml # 06 §5.4；运行中可用 set_sizing.py / 看板调节
risk:
  cooldown_bars: 15
  max_chase: 0.003
  pause_after_losses_min: 120
  spread_mult_limit: 3.0
health:
  ws_lag_sec: 2.0
  order_error_limit_5m: 5
  clock_drift_ms: 1000
  weight_usage_limit: 0.7
  fee_mismatch_reject_ratio: 1.2 # 实际吃单费率 > 配置 × 1.2 时拒绝 live 启动
exits: ./configs/exits.yaml # 必须与 model_meta.json 的 exit_policy 一致
notify:
  channels:
    - provider: wxpusher # 主通道：个人微信
      token_env: WXPUSHER_APP_TOKEN
      uid_env: WXPUSHER_UID
      events: [start, stop, open, stop_move, close, sizing, alert, halt, daily]
      rate_per_min: 10
      redact_amounts: false # true：只发百分比，不发 USDT 金额
    - provider: wecom # 备份通道：企业微信
      key_env: WECOM_WEBHOOK_KEY
      events: [alert, halt, heartbeat, channel_down]
      rate_per_min: 15 # 低于官方 20 条/分钟
      max_bytes: 4096
    - { provider: feishu, enabled: false, events: [] } # 可选
  heartbeat_min: 60
  daily_report_utc: "00:05"
storage:
  db_path: ./artifacts/live/state.db
  bars_dir: ./artifacts/live/bars
  retention_days: 90
