# 实盘运行配置。规格：docs/07-实盘与风控.md §12
# 字段与 trade.live.config.LiveConfig 一一对应，未知字段报错。
# 本文件描述低频引擎（小时级调仓、多空、持仓数个到十几个）的运行参数。

# 运行模式只是默认值；实际模式由 scripts/live_runner.py --mode 决定
mode: shadow # paper | shadow | live
# 旧版字段（分钟级引擎遗留，低频引擎不使用；保留字段以保持配置模型兼容）
model_dir: ./artifacts/models/unused
sizing: ./configs/sizing.yaml
exits: ./configs/exits.yaml

margin_type: ISOLATED
position_mode: ONE_WAY

notify:
  channels:
    - provider: wxpusher # 个人微信
      token_env: WXPUSHER_APP_TOKEN
      uid_env: WXPUSHER_UID
      events: [start, stop, open, close, sizing, alert, halt, daily]
      rate_per_min: 10
      redact_amounts: false # true：只发百分比，不发 USDT 金额
    - provider: wecom # 备份通道；未配置时为 no-op
      key_env: WECOM_WEBHOOK_KEY
      events: [alert, halt, channel_down]
      rate_per_min: 15
      max_bytes: 4096
  heartbeat_min: 60
  daily_report_utc: "00:10"

storage:
  db_path: ./artifacts/live/state.db
  bars_dir: ./artifacts/live/bars
  retention_days: 90

# 低频引擎（docs/07 §6、§12）
engine:
  ledger: ./docs/research/ledger.yaml
  candidates_dir: ./docs/research/candidates
  final_dir: ./docs/research/final
  shadow_dir: ./docs/research/shadow
  research: ./configs/research.yaml
  base: ./configs/base.yaml
  backtest: ./configs/backtest.yaml
  sizing_research: ./configs/sizing_research.yaml
  klines_1h: ./data/klines_1h
  klines_1d: ./data/klines_1d
  funding: ./data/funding
  universe_hist: ./data/universe_hist
  history_days_hourly: 45
  history_days_daily: 120
  funding_limit: 1000
  live_capital_cap: 500.0 # 真钱上限，USDT，允许范围 (0, 1000]（风险包络只能由使用者决定，红线 5）
  hide_pnl_until_final: true # shadow / paper 在最终检验未通过前不显示虚拟收益
  rebalance_delay_sec: 30 # 整点后多少秒拉取刚收盘的 1h K 线
  post_only_wait_sec: 45
  ioc_tick_buffer: 2
  heartbeat_minutes: 5
  loop_sleep_sec: 20
  max_order_errors_1h: 5
  clock_drift_ms: 1000
  spread_median_mult: 5.0
  spread_lookback_hours: 24
  net_exposure_cap: 0.5
  net_exposure_grace_min: 10
  fee_reject_ratio: 1.2
  daily_report_utc: "00:10"
  watchdog_stale_min: 15
