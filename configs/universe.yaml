# 规则化月度选币配置（03 §4.6）。
# 数据窗口不在此重复配置，统一取 base.yaml 的 data_window。
# reviewed 由使用者审阅首份快照后手动改为 true（08 G1）；Agent 不得自行设置。
reviewed: false
btc_context: BTCUSDT
rule:
  rebalance: monthly # 每个 UTC 自然月 1 日 00:00 再平衡
  new_entry_delay_days: 2 # 新进入的币只监控不开仓的天数（06 §3.1、07 §3.5 同读此值）
  top_n: 60 # 按 30 天日成交额中位数取前 N
  min_listing_days: 60 # 距首根日线 ≥ 60 天
  lookback_days: 30 # 排名与流动性统计窗口
  min_daily_quote_median: 20000000 # 30 天日成交额中位数 ≥ 2000 万 USDT
  step_notional_max: 0.5 # stepSize × 7 天日收盘价中位数 ≤ 0.5 USDT
  min_notional_max: 5.0 # 最小下单额 ≤ 5 USDT
  min_leverage: 5 # 杠杆分层允许 ≥ 5x
  tick_rel_max: 0.0002 # tickSize / 30 天日收盘价中位数 ≤ 2 bp
  exclude_bases: [BTC, ETH] # 仅作环境 / 非山寨币
  exclude_stable: true # USDC、FDUSD 等稳定币对
  exclude_tradfi: true # contractType / underlyingType 识别的 TradFi 合约
  excluded_symbols: [] # 使用者确认的额外排除（写明理由）
roles:
  holdout_mod: 5 # sha256(symbol) 取模，余数为 holdout_rem 的币进入留出组
  holdout_rem: 0
quality: # 03 §2.4（选币第 7 步的数据质量门槛）
  missing_ratio_max: 0.01
  aggtrades_missing_ratio_max: 0.01
  consistency_error_max: 0.02
