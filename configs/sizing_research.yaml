# 研究期风险包络（docs/13-研究框架.md §2、§3；数值由使用者确定，Agent 不得自行修改）。
# 字段与 pydantic 模型 trade.research.config.ResearchSizingConfig 一一对应，未知字段报错。

initial_equity: 500 # 可执行口径初始权益 USDT（与实盘资金一致）；信号口径 10000 见 research.yaml equity
mode: fixed_risk # fixed_fraction | fixed_risk（模式 A 的单仓名义口径）
position_frac: 0.08 # 每仓保证金上限 = 权益 × 8%
leverage: 5
max_positions: 10 # 0.08 × 10 = 0.80 ≤ 0.95
base: equity # 按当前权益复利
risk_per_trade: 0.0075 # 标准档；实际取值由下面的 tier 决定
max_risk_per_trade: 0.025 # 单笔止损亏损硬上限（占权益）；模式 B 另受该档防灾止损上限约束
daily_loss_stop: 0.05 # 标准档：当日亏损达权益 5% 停止开仓
daily_loss_halt: 0.08 # 标准档：当日亏损达 8% 全平并停机
max_drawdown_halt: 0.20 # 标准档：从峰值回撤 20% 停机
max_consecutive_losses: 6
consecutive_loss_pause_min: 120 # 连续止损后暂停开仓分钟数
liq_cap: 0.005 # 单币名义 ≤ 0.5% × 该币 24 小时成交额 / 24
maint_margin_rate: 0.01 # 维持保证金率（保守值）

# 仓位模式与中性策略调整（docs/13 §2、§3）：网格参数里的 sizing_mode 覆盖本默认值。
sizing_mode: fixed_risk # fixed_risk（模式 A）| vol_target（模式 B）
target_vol: 0.20 # 模式 B 的组合事前年化波动目标；with_tier() 用选中档位的值覆盖
vol_lookback_days: 30 # 模式 B 权重用过去 30 天日收益标准差
cov_lookback_days: 60 # 组合波动用过去 60 天日收益协方差
beta_lookback_days: 60 # β = 过去 60 天日收益对 BTCUSDT 日收益的回归系数
beta_abs_max: 0.10 # 中性策略组合事前 |β| ≤ 0.10
ls_ratio_range: [0.5, 2.0] # 中性策略多头总名义 ÷ 空头总名义

# 风险档位（1 号第二部分第 3 条、docs/00 §2）：研究与达标判定用 standard；冻结时在满足可执行性
# 检查的档位中选实盘档位（红线 5：数值由使用者确定）。
tier: standard
risk_tiers:
  standard:
    risk_per_trade: 0.0075
    target_vol: 0.20
    disaster_loss_cap: 0.025
    daily_loss_stop: 0.05
    daily_loss_halt: 0.08
    max_drawdown_halt: 0.20
  progressive:
    risk_per_trade: 0.015
    target_vol: 0.40
    disaster_loss_cap: 0.05
    daily_loss_stop: 0.08
    daily_loss_halt: 0.12
    max_drawdown_halt: 0.35
  aggressive:
    risk_per_trade: 0.0225
    target_vol: 0.60
    disaster_loss_cap: 0.075
    daily_loss_stop: 0.12
    daily_loss_halt: 0.18
    max_drawdown_halt: 0.50
  extreme:
    risk_per_trade: 0.03
    target_vol: 0.80
    disaster_loss_cap: 0.10
    daily_loss_stop: 0.15
    daily_loss_halt: 0.22
    max_drawdown_halt: 0.60
