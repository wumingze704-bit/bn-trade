[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trade"
version = "0.1.0"
description = "币安山寨币分钟级超短线量化工具"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx==0.28.1",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "numba==0.68.0",
    "numpy==2.4.6",
    "pandas==3.1.0",
    "plotly==7.1.0",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "PyYAML==6.0.3",
    "scipy==1.17.1",
    "streamlit==1.66.1",
    "torch==2.14.1",
    "websockets==17.3",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pip-tools==7.6.2",
    "pytest==9.1.1",
    "ruff==0.17.3",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
