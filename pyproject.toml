[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trade"
version = "0.1.0"
description = "币安山寨币分钟级超短线量化工具"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx==0.28.1",
    "numba==0.68.0",
    "numpy==2.4.6",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "PyYAML==6.0.3",
    "scipy==1.17.1",
    "websockets==17.3",
]

[project.optional-dependencies]
research = [
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "plotly==7.1.0",
    "torch==2.14.1+cu126",
]
live = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "binance-sdk-derivatives-trading-usds-futures==18.2.0",
    "torch==2.14.1",
]
dev = [
    "mypy==2.4.0",
    "pip-tools==7.6.2",
    "pytest==9.1.1",
    "ruff==0.17.3",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# H_label 为文档定义的标签参数名（04 §7），保持与设计文档一致
"src/trade/labels/triple_barrier.py" = ["N803"]
# 出场策略（06 §3.3）与仓位公式（06 §4.2/§5）沿用设计文档的符号名
# H_max（最长持仓根数）、R（1R 价格距离）、Y（冲击系数）、H_label（时间障碍）
"src/trade/common/exits.py" = ["N803", "N806"]
"src/trade/backtest/engine.py" = ["N803", "N806"]
"src/trade/backtest/event_sim.py" = ["N803"]
"src/trade/backtest/sanity.py" = ["N803"]
"src/trade/backtest/costs.py" = ["N803"]
# 测试允许中文函数名（AGENTS.md §7）；出场测试用单字母 OHLC 变量、H_max 为文档名
"tests/**/*.py" = ["N802"]
"tests/common/test_exits.py" = ["E741", "N803"]

[tool.mypy]
python_version = "3.11"
strict = true
